<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 영화 티어리스트</title>
<style>
:root{
  --gold:#d9b45a;
  --gold-hi:#f6e3a6;
  --w:70px;
  --sw:84px;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  color:#f7efe0;
  background:#0b0806;
  overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background-image:linear-gradient(180deg,rgba(6,4,3,.78) 0%,rgba(6,4,3,.6) 40%,rgba(6,4,3,.82) 100%);
}
#bg{
  position:fixed;inset:0;width:100vw;height:100vh;z-index:-2;pointer-events:none;
  background:#0b0806 var(--bg,none) center/cover no-repeat;
}
img{-webkit-user-drag:none;user-drag:none}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}

#app{
  min-height:100vh;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;
}

/* ===== 머리말 ===== */
.head{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:clamp(6px,1.4vh,14px) 24px 0;
}
.head-center{text-align:center;grid-column:2;min-width:0}
.eyebrow{
  font-size:clamp(9px,1.4vh,13px);letter-spacing:.42em;color:var(--gold);
  font-weight:600;padding-left:.42em;
}
h1{
  margin:.1em 0 .05em;
  font-family:"Didot","Bodoni 72","AppleMyungjo","Noto Serif KR","Batang",Georgia,serif;
  font-size:clamp(24px,4.6vh,48px);font-weight:700;letter-spacing:.06em;line-height:1.15;
  background:linear-gradient(180deg,#fff3c4 0%,#e8c46a 45%,#b98a2c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
}
.rule{
  display:flex;align-items:center;justify-content:center;gap:12px;
  color:var(--gold);font-size:clamp(10px,1.5vh,14px);
}
.rule::before,.rule::after{content:"";width:clamp(40px,10vw,140px);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{margin:.2em 0 0;font-size:clamp(11px,1.7vh,15px);color:#e3d7bb;letter-spacing:.04em}
.actions{grid-column:3;justify-self:end;display:flex;gap:10px}
.btn{
  font-size:14px;font-weight:700;letter-spacing:.04em;
  padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;
  border:1.5px solid var(--gold);color:#2a1d05;
  background:linear-gradient(180deg,#f6e3a6,#d9b45a);
  box-shadow:0 2px 10px rgba(0,0,0,.45);
  transition:transform .12s,filter .12s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(0,0,0,.45);color:var(--gold-hi)}
.btn:disabled{opacity:.55;cursor:wait}

/* ===== 영화 추가 ===== */
.tools{display:flex;justify-content:center;gap:10px;padding:10px 16px 0}
.tools input{
  min-width:0;flex:1 1 200px;max-width:360px;
  padding:9px 18px;border-radius:999px;font-size:16px;
  border:1.5px solid var(--gold);background:rgba(0,0,0,.5);color:var(--gold-hi);
  -webkit-user-select:text;user-select:text;
}
.tools input::placeholder{color:#b9aa88}

/* ===== 피라미드 ===== */
#stage{display:flex;justify-content:center;align-content:center;align-items:center;min-width:0;padding:8px 12px}
#pyramid{display:flex;flex-direction:column;align-items:center;gap:calc(var(--w)*.12);max-width:100%;min-width:0}
.tier{
  --cw:var(--w);
  --fs:max(8px,calc(var(--cw)*.14));
  display:grid;grid-template-columns:calc(var(--w)*.75) auto calc(var(--w)*.75);
  align-items:center;gap:calc(var(--w)*.1);
  padding:calc(var(--w)*.12);
  max-width:100%;
  border:2px solid var(--c);
  background:var(--bgc);
  border-radius:calc(var(--w)*.18);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
  backdrop-filter:blur(2px);
  transition:border-color .2s,background .2s;
  position:relative;overflow:hidden;
}
.s-empty{--c:#8d8d8d;--bgc:rgba(130,130,130,.30)}
.s-under{--c:#f2c230;--bgc:rgba(242,194,48,.30)}
.s-exact{--c:#3fcf7a;--bgc:rgba(63,207,122,.28)}
.s-over {--c:#ff4d4d;--bgc:rgba(255,77,77,.34)}
.tier.hot-row{filter:brightness(1.18)}
.label{
  height:calc(var(--w)*.75);display:flex;align-items:center;justify-content:center;
  padding:0;-webkit-appearance:none;appearance:none;cursor:default;
  border-radius:calc(var(--w)*.14);border:2px solid var(--c);background:var(--tl);position:relative;
  font-family:"Didot","Bodoni 72","AppleMyungjo",Georgia,serif;font-weight:700;
  font-size:calc(var(--w)*.5);color:var(--tt);text-shadow:var(--tts);
}
.count{text-align:center;white-space:nowrap;font-size:max(10px,calc(var(--w)*.2));font-weight:700;color:var(--c);text-shadow:0 1px 4px rgba(0,0,0,.7)}
.slots{display:flex;flex-wrap:wrap;min-width:0;gap:calc(var(--w)*.1)}
.slot{
  position:relative;flex:0 0 auto;
  width:var(--cw);height:calc(var(--cw)*1.5);
  border:2px dashed rgba(255,255,255,.5);border-radius:6px;background:rgba(0,0,0,.28);
}
.slot.filled{border-style:solid;border-color:rgba(246,227,166,.55);background:transparent}
.slot.extra{border:0}
.slot.hot{
  border-color:var(--gold-hi);background:rgba(246,227,166,.14);
  box-shadow:0 0 0 3px rgba(246,227,166,.35),0 0 18px rgba(246,227,166,.55);
}

/* ===== 티어별 꾸밈 (높을수록 화려하게) ===== */
.tier{--tts:0 2px 6px rgba(0,0,0,.6)}
.tier[data-t="S"]{--tl:linear-gradient(135deg,#fff3b0,#ffd23f 40%,#ff9d1c 70%,#fff3b0);--tt:#4a2c00;--tts:0 1px 0 rgba(255,255,255,.7);--glow:255,205,70}
.tier[data-t="A"]{--tl:linear-gradient(135deg,#f3b3ff,#b455ff 55%,#7a2bd6);--tt:#fff;--glow:190,100,255}
.tier[data-t="B"]{--tl:linear-gradient(135deg,#a6dcff,#3d9bff 60%,#2a63d8);--tt:#fff;--glow:70,160,255}
.tier[data-t="C"]{--tl:linear-gradient(135deg,#c8dcd8,#7fa6a4 60%,#5b8381);--tt:#fff;--glow:120,170,168}
@keyframes glowHi{
  0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 12px rgba(var(--glow),.45)}
  50%{box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 36px 5px rgba(var(--glow),.95)}
}
@keyframes glowMid{
  0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 8px rgba(var(--glow),.3)}
  50%{box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 22px 2px rgba(var(--glow),.7)}
}
@keyframes sweep{
  0%{left:-45%}
  60%,100%{left:125%}
}
@keyframes shimmer{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.6) rotate(0)}
  50%{opacity:1;transform:scale(1.15) rotate(45deg)}
}
.tier[data-t="S"]::after,.tier[data-t="A"]::after{
  content:"";position:absolute;top:0;bottom:0;left:-45%;width:30%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);
}
.tier[data-t="S"]{animation:glowHi 1.6s ease-in-out infinite}
.tier[data-t="S"]::after{animation:sweep 2.4s linear infinite}
.tier[data-t="S"] .label{
  background-size:250% 250%;animation:shimmer 2.2s ease-in-out infinite;
  box-shadow:0 0 calc(var(--w)*.28) rgba(255,210,70,.85);
}
.tier[data-t="S"] .label::after{
  content:"\2726";position:absolute;top:calc(var(--w)*.03);right:calc(var(--w)*.06);
  font-size:calc(var(--w)*.17);line-height:1;color:#fff;text-shadow:0 0 6px #fff;
  animation:twinkle 1.2s ease-in-out infinite;
}
.tier[data-t="A"]{animation:glowMid 2.6s ease-in-out infinite}
.tier[data-t="A"]::after{animation:sweep 4.6s linear infinite}
.tier[data-t="A"] .label{box-shadow:0 0 calc(var(--w)*.18) rgba(190,100,255,.7)}
.tier[data-t="B"]{animation:glowMid 4s ease-in-out infinite}
.tier[data-t="B"] .label{box-shadow:0 0 calc(var(--w)*.1) rgba(70,160,255,.55)}
.has-sel .label{cursor:pointer;transition:transform .12s,filter .12s}
.has-sel .label:hover{transform:scale(1.08);filter:brightness(1.2)}
.has-sel .label:active{transform:scale(.97)}

/* ===== 카드 ===== */
.card{
  position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;
  cursor:grab;touch-action:none;background:#222;
  box-shadow:0 3px 10px rgba(0,0,0,.5);
}
.card:focus-visible{outline-offset:-3px}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cap{
  position:absolute;left:0;right:0;bottom:0;padding:22px 4px 4px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 55%);
  font-size:var(--fs);line-height:1.22;font-weight:700;text-align:center;color:#fff;
  word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;
}
.card.is-source{opacity:.22}
.card.selected{box-shadow:0 0 14px rgba(255,40,40,.85)}
.card.selected::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  border:5px solid #ff1f1f;border-radius:inherit;
}
.card:active{cursor:grabbing}
.ghost-card{
  position:fixed;z-index:1000;pointer-events:none;border-radius:6px;overflow:hidden;
  transform:translate(-50%,-50%) scale(1.07) rotate(-3deg);
  box-shadow:0 16px 34px rgba(0,0,0,.65);
}
.ghost-card .card{opacity:1;cursor:grabbing}

/* ===== 하단 슬라이드 ===== */
.slider{
  padding:8px 0 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.7));
  border-top:1px solid rgba(217,180,90,.55);
  --fs:clamp(11px,calc(var(--sw)*.13),15px);
}
.slider.hot{outline:2px dashed var(--gold-hi);outline-offset:-4px}
.slider-label{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:0 24px 8px;
  font-size:12px;color:#d8cbb0;letter-spacing:.03em;
}
.slider-label b{color:var(--gold-hi)}
.pool-head{
  color:#d8cbb0;background:rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;
  border:1px solid rgba(217,180,90,.55);border-radius:999px;padding:3px 14px;font-size:12px;letter-spacing:.03em;
}
.viewport{overflow:hidden;position:relative}
.track{display:flex;width:max-content;will-change:transform}
.grp{display:flex;flex:0 0 auto}
.s-item{flex:0 0 auto;width:var(--sw);height:calc(var(--sw)*1.5);margin-right:14px}
.empty-msg{
  height:calc(var(--sw)*1.5);display:flex;align-items:center;justify-content:center;
  color:var(--gold-hi);font-size:16px;letter-spacing:.06em;
}

/* ===== 효과 (폭죽·비) ===== */
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:900}

/* ===== 알림 ===== */
#toast{
  position:fixed;left:50%;bottom:calc(var(--sw)*1.5 + 90px);transform:translate(-50%,12px);
  max-width:calc(100vw - 32px);text-align:center;
  padding:10px 20px;border-radius:999px;background:rgba(0,0,0,.82);border:1px solid var(--gold);
  color:var(--gold-hi);font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:2000;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .head{grid-template-columns:minmax(0,1fr);gap:8px;justify-items:center}
  .head-center,.actions{grid-column:1;justify-self:center}
}
@media (max-width:520px){
  .slider-label{padding:0 16px 8px}
  .eyebrow{letter-spacing:.3em}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header class="head" id="head">
    <div class="head-center">
      <div class="eyebrow">THE GOLDEN TIER AWARDS</div>
      <h1>내 영화 티어리스트</h1>
      <div class="rule">★ ★ ★</div>
      <p class="sub" id="subTitle"></p>
    </div>
    <div class="actions">
      <button class="btn" id="btnSave" type="button">이미지 저장</button>
      <button class="btn ghost" id="btnReset" type="button">처음으로</button>
    </div>
  </header>

  <form class="tools" id="add-form" autocomplete="off">
    <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
    <button class="btn" type="submit">추가</button>
  </form>

  <main id="stage"><div id="pyramid"></div></main>

  <section class="slider" id="slider" aria-label="아직 안 정한 영화">
    <div class="slider-label">
      <span>카드를 끌어다 놓거나, 클릭해 선택한 뒤 티어 글자(또는 S·A·B·C 키)를 누르세요. 올려 둔 카드는 박스 밖으로 끌어다 놓으면 해제돼요.</span>
      <button class="pool-head" id="pool-label" type="button" aria-label="미분류로 옮기기">아직 안 정한 영화 <b id="remain">0</b>편</button>
    </div>
    <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
  </section>
</div>
<canvas id="fx"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- 영화 카드 그림 (외부 파일 없이 만든 포스터) ---------- */
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function posterOf(title){
  let h=0;for(const ch of title)h=(h*31+ch.codePointAt(0))>>>0;
  const h1=h%360,h2=(h1+45)%360,mono=esc(Array.from(title)[0]||'?');
  let holes='';
  for(let y=10;y<296;y+=22)holes+='<rect x="6" y="'+y+'" width="8" height="12" rx="2"/><rect x="186" y="'+y+'" width="8" height="12" rx="2"/>';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h1+',58%,40%)"/><stop offset="1" stop-color="hsl('+h2+',62%,15%)"/></linearGradient>'
    +'<radialGradient id="r" cx=".5" cy=".38" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>'
    +'<rect width="200" height="300" fill="url(#g)"/><rect width="200" height="300" fill="url(#r)"/>'
    +'<circle cx="100" cy="112" r="62" fill="none" stroke="#f6e3a6" stroke-opacity=".5" stroke-width="2"/>'
    +'<text x="100" y="112" text-anchor="middle" dominant-baseline="central" font-family="Didot,AppleMyungjo,Georgia,serif" font-size="78" font-weight="700" fill="#f6e3a6" fill-opacity=".92">'+mono+'</text>'
    +'<g fill="#000" fill-opacity=".45">'+holes+'</g></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

const imgOf=title=>POSTERS[title]||posterOf(title);
root.style.setProperty('--bg','url("'+BG+'")');

/* ---------- 상태 ---------- */
let movies=[],byId=new Map(),nextId=1,state={};
let selId=null;   // 클릭해서 선택한 영화
function setMovies(list){
  movies=list.map(m=>({id:m.id,title:m.title,img:imgOf(m.title)}));
  byId=new Map(movies.map(m=>[m.id,m]));
}
function freshState(){const t={};TIERS.forEach(x=>{t[x.k]=new Array(x.cap).fill(null)});return t}
function freshAll(){
  setMovies(INITIAL_TITLES.map((title,i)=>({id:'m'+(i+1),title})));
  nextId=INITIAL_TITLES.length+1;
  state=freshState();
}

// 카드를 항상 왼쪽부터 빈칸 없이 채우고, 정원보다 모자란 만큼만 오른쪽에 빈칸을 둔다
function normalize(k){
  const cap=capOf(k);
  const arr=state[k].filter(Boolean);
  while(arr.length<cap)arr.push(null);
  state[k]=arr;
}
function countOf(k){return state[k].filter(Boolean).length}
function locate(id){
  for(const t of TIERS){const i=state[t.k].indexOf(id);if(i>=0)return{k:t.k,i}}
  return null;
}
function removeFrom(id){
  const loc=locate(id);
  if(loc){state[loc.k][loc.i]=null;normalize(loc.k)}
}
// idx: 놓은 칸 번호(없으면 null)
function dropTo(id,k,idx){
  const prev=locate(id);
  removeFrom(id);                       // 있던 자리에서 빼고(그 티어도 왼쪽으로 다시 붙임)
  const arr=state[k].filter(Boolean);   // 놓을 티어의 카드만 모아서
  const at=idx==null?arr.length:Math.min(idx,arr.length);
  arr.splice(at,0,id);                  // 놓은 위치에 끼워 넣는다 (빈칸이면 맨 끝 = 왼쪽부터 채움)
  state[k]=arr;
  normalize(k);
  if(selId===id)setSel(null);
  if(!prev||prev.k!==k)playFx(k);
}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return false;
    const o=JSON.parse(raw);
    if(!o||!Number.isSafeInteger(o.nextId)||!Array.isArray(o.movies)
       ||!o.movies.every(m=>m&&typeof m.id==='string'&&typeof m.title==='string'&&m.title.trim()))return false;
    const ids=new Set(),list=[];
    o.movies.forEach(m=>{if(!ids.has(m.id)){ids.add(m.id);list.push({id:m.id,title:m.title})}});
    setMovies(list);nextId=o.nextId;
    const seen=new Set(),t=freshState();
    TIERS.forEach(x=>{
      const a=o.tiers&&Array.isArray(o.tiers[x.k])?o.tiers[x.k]:[];
      t[x.k]=a.map(id=>(typeof id==='string'&&byId.has(id)&&!seen.has(id))?(seen.add(id),id):null);
    });
    state=t;return true;
  }catch(e){return false}
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({nextId,movies:movies.map(m=>({id:m.id,title:m.title})),tiers:state}))}
  catch(e){toast('이 브라우저에서는 저장하지 못했어요. 현재 화면에서 확인한 내용과 다시 열어 확인한 내용을 구분해 주세요.')}
}
if(!load())freshAll();
TIERS.forEach(t=>normalize(t.k));

/* ---------- 카드 만들기 ---------- */
function makeCard(m,dup){
  const c=document.createElement('div');
  c.className='card';c.dataset.id=m.id;c.title=m.title;
  c.setAttribute('role','button');c.setAttribute('aria-label',m.title);
  c.setAttribute('aria-pressed',String(m.id===selId));
  c.tabIndex=dup?-1:0;
  if(dup)c.setAttribute('aria-hidden','true');
  const img=document.createElement('img');img.src=m.img;img.alt='';img.draggable=false;
  const cap=document.createElement('div');cap.className='cap';cap.textContent=m.title;
  if(m.id===selId)c.classList.add('selected');
  c.append(img,cap);return c;
}

/* ---------- 피라미드 ---------- */
const pyramid=$('pyramid');
const rows={};
TIERS.forEach(t=>{
  const row=document.createElement('div');
  row.className='tier s-empty';row.dataset.t=t.k;
  row.innerHTML='<button type="button" class="label" aria-label="'+t.k+'등급으로 옮기기">'+t.k+'</button><div class="slots"></div><div class="count"></div>';
  pyramid.appendChild(row);rows[t.k]=row;
});
// 칸 수를 넘기면 줄 폭을 늘리고, 화면 폭이 모자랄 때만 카드를 줄인다 (단위: 칸 폭 W)
let availU=10;
function calcF(cap,m,avail){
  if(m<=cap)return 1;
  const need=1.94+m+0.1*(m-1);
  if(need<=avail)return 1;
  return Math.max(.3,(avail-1.94-0.1*(m-1))/m);
}
function tierStatus(k){
  const n=countOf(k),cap=capOf(k);
  return n===0?'empty':n<cap?'under':n===cap?'exact':'over';
}
function renderTiers(){
  TIERS.forEach(t=>{
    const row=rows[t.k],arr=state[t.k],cap=t.cap,m=Math.max(cap,arr.length);
    const st=tierStatus(t.k);
    row.className='tier s-'+st;
    const f=calcF(cap,m,availU);
    row.style.setProperty('--cw','calc(var(--w)*'+f.toFixed(4)+')');
    row.querySelector('.count').textContent=countOf(t.k)+' / '+cap;
    const slots=row.querySelector('.slots');slots.textContent='';
    for(let i=0;i<m;i++){
      const s=document.createElement('div');
      s.className='slot'+(i>=cap?' extra':'');
      s.dataset.t=t.k;s.dataset.i=i;
      if(arr[i]){s.classList.add('filled');s.appendChild(makeCard(byId.get(arr[i])))}
      slots.appendChild(s);
    }
  });
}

/* ---------- 하단 슬라이드 ---------- */
const track=$('track'),viewport=$('viewport');
let sx=0,cycle=0,paused=false,lastT=performance.now(),SW=84;
function renderSlider(){
  const items=movies.filter(m=>!locate(m.id));
  $('remain').textContent=items.length;
  track.textContent='';cycle=0;
  if(!items.length){
    const e=document.createElement('div');e.className='empty-msg';
    e.style.width=viewport.clientWidth+'px';e.textContent='모든 영화를 배치했어요';
    track.appendChild(e);track.style.transform='translate3d(0,0,0)';return;
  }
  const vw=viewport.clientWidth||innerWidth;
  cycle=Math.max(items.length*(SW+GAP),vw+SW+GAP);
  for(let g=0;g<2;g++){
    const grp=document.createElement('div');grp.className='grp';grp.style.width=cycle+'px';
    items.forEach(m=>{
      const it=document.createElement('div');it.className='s-item';
      it.appendChild(makeCard(m,g===1));grp.appendChild(it);
    });
    track.appendChild(grp);
  }
  sx=sx%cycle;
  track.style.transform='translate3d('+(-sx)+'px,0,0)';
}

/* ---------- 배치 효과 (3초) ---------- */
const fxCv=$('fx'),fxCtx=fxCv.getContext('2d');
const FX_MS=3000;
let fxMode=null,fxT0=0,fxLast=0,fxRaf=0,fxP=[],fxBursts=[],fxDrops=[];
function fxResize(){
  const d=window.devicePixelRatio||1;
  fxCv.width=Math.round(innerWidth*d);fxCv.height=Math.round(innerHeight*d);
  fxCtx.setTransform(d,0,0,d,0,0);
}
let fxRings=[],fxRow=null;
function playFx(k){
  cancelAnimationFrame(fxRaf);
  fxResize();
  fxMode=k;fxT0=performance.now();fxLast=fxT0;fxP=[];fxBursts=[];fxDrops=[];fxRings=[];
  const W=innerWidth,H=innerHeight,R=Math.random;
  const rr=rows[k].getBoundingClientRect();
  fxRow={x:rr.left+rr.width/2,y:rr.top+rr.height/2,l:rr.left,w:rr.width,t:rr.top,b:rr.bottom};
  if(k==='S'){fxBursts=[0,.4,.8,1.2,1.65,2.05];}
  else if(k==='C'){           // 비
    for(let i=0;i<260;i++)fxDrops.push({
      x:R()*(W+200)-100,y:R()*H,v:900+R()*600,l:14+R()*18
    });
  }else if(k==='A'){          // 보라·분홍 색종이
    const hs=[285,320,45,200,265];
    for(let i=0;i<150;i++)fxP.push({
      x:R()*W,y:-20-R()*H*1.2,vy:350+R()*250,ph:R()*6.28,sw:30+R()*50,
      rot:R()*6.28,vr:(R()-.5)*10,w:7+R()*7,h:4+R()*5,hue:hs[i%5]+R()*16-8
    });
  }else{                      // B: 푸른 물결 + 반짝임
    fxBursts=[0,.6,1.2,1.8];
    for(let i=0;i<44;i++)fxP.push({
      x:fxRow.l+R()*fxRow.w,y:fxRow.y+(R()-.5)*(fxRow.b-fxRow.t)*.6,
      vx:(R()-.5)*60,vy:-(120+R()*160),age:-R()*1.8,life:.8+R()*.3
    });
  }
  fxRaf=requestAnimationFrame(fxFrame);
}
function fxSpawnBurst(){
  const W=innerWidth,H=innerHeight;
  const cx=W*(.12+Math.random()*.76),cy=H*(.1+Math.random()*.4);
  const hues=[48,38,330,200,120,12,275];
  const h=hues[Math.floor(Math.random()*hues.length)];
  for(let i=0;i<72;i++){
    const a=Math.PI*2*i/72+Math.random()*.08,sp=130+Math.random()*250;
    fxP.push({x:cx,y:cy,px:cx,py:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      age:0,life:.7+Math.random()*.25,h:h+(Math.random()*30-15)});
  }
}
function fxFrame(now){
  const t=now-fxT0,dt=Math.min(.05,(now-fxLast)/1000);fxLast=now;
  const W=innerWidth,H=innerHeight;
  fxCtx.clearRect(0,0,W,H);
  if(t>=FX_MS){fxMode=null;fxP=[];fxDrops=[];fxRings=[];return}
  const a=Math.max(0,Math.min(1,t/150,(FX_MS-t)/300));   // 시작·끝에서 부드럽게
  if(fxMode==='S'){
    while(fxBursts.length&&fxBursts[0]*1000<=t){fxBursts.shift();fxSpawnBurst()}
    fxCtx.globalCompositeOperation='lighter';
    fxCtx.lineCap='round';
    for(const p of fxP){
      p.age+=dt;if(p.age>=p.life)continue;
      p.px=p.x;p.py=p.y;
      p.vy+=260*dt;const dr=1-1.3*dt;p.vx*=dr;p.vy*=dr;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      const k=1-p.age/p.life;
      fxCtx.strokeStyle='hsla('+p.h+',100%,'+(58+k*12)+'%,'+(k*a)+')';
      fxCtx.lineWidth=1.5+k*2.2;
      fxCtx.beginPath();fxCtx.moveTo(p.px,p.py);fxCtx.lineTo(p.x,p.y);fxCtx.stroke();
    }
    fxCtx.globalCompositeOperation='source-over';
  }else if(fxMode==='C'){
    fxCtx.fillStyle='rgba(25,35,70,'+(.28*a)+')';fxCtx.fillRect(0,0,W,H);
    fxCtx.strokeStyle='rgba(175,205,255,'+(.6*a)+')';fxCtx.lineWidth=1.4;fxCtx.lineCap='round';
    fxCtx.beginPath();
    for(const d of fxDrops){
      d.y+=d.v*dt;d.x+=d.v*.2*dt;
      if(d.y>H){d.y=-d.l;d.x=Math.random()*(W+200)-100}
      fxCtx.moveTo(d.x,d.y);fxCtx.lineTo(d.x-d.l*.2,d.y-d.l);
    }
    fxCtx.stroke();
  }else if(fxMode==='A'){
    for(const p of fxP){
      p.y+=p.vy*dt;p.x+=Math.sin(t/1000*3+p.ph)*p.sw*dt;p.rot+=p.vr*dt;
      if(p.y>H+20)continue;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot);
      fxCtx.fillStyle='hsla('+p.hue+',90%,62%,'+a+')';
      fxCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxCtx.restore();
    }
  }else{
    while(fxBursts.length&&fxBursts[0]*1000<=t){fxBursts.shift();fxRings.push({age:0})}
    fxCtx.globalCompositeOperation='lighter';
    for(const r of fxRings){
      r.age+=dt;if(r.age>=1)continue;
      const k=1-r.age;
      fxCtx.strokeStyle='hsla(205,100%,65%,'+(k*a)+')';fxCtx.lineWidth=1+4*k;
      fxCtx.beginPath();fxCtx.arc(fxRow.x,fxRow.y,30+r.age*620,0,Math.PI*2);fxCtx.stroke();
    }
    for(const p of fxP){
      p.age+=dt;if(p.age<0||p.age>=p.life)continue;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      const k=1-p.age/p.life;
      fxCtx.fillStyle='hsla(200,100%,75%,'+(k*a)+')';
      fxCtx.beginPath();fxCtx.arc(p.x,p.y,1+2.5*k,0,Math.PI*2);fxCtx.fill();
    }
    fxCtx.globalCompositeOperation='source-over';
  }
  fxRaf=requestAnimationFrame(fxFrame);
}

/* ---------- 이미지 저장 (16:9 PNG) ---------- */
const imgCache=new Map();
function loadImg(src){
  if(imgCache.has(src))return imgCache.get(src);
  const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  imgCache.set(src,p);return p;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function coverDraw(ctx,img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function wrapLines(ctx,text,maxW,maxLines){
  const lines=[];let cur='';
  for(const word of text.split(' ')){
    const test=cur?cur+' '+word:word;
    if(ctx.measureText(test).width<=maxW){cur=test;continue}
    if(cur){lines.push(cur);cur=''}
    if(ctx.measureText(word).width<=maxW){cur=word;continue}
    let part='';
    for(const ch of word){
      if(ctx.measureText(part+ch).width>maxW){lines.push(part);part=ch}else part+=ch;
    }
    cur=part;
  }
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    lines.length=maxLines;let l=lines[maxLines-1];
    while(l.length>1&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);
    lines[maxLines-1]=l+'…';
  }
  return lines;
}
function drawCard(ctx,img,x,y,w,h,title){
  ctx.save();
  roundRect(ctx,x,y,w,h,Math.max(4,w*.06));ctx.clip();
  coverDraw(ctx,img,x,y,w,h);
  const fs=Math.max(8,w*.14);
  ctx.font='700 '+fs+'px '+SANS;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const lines=wrapLines(ctx,title,w-8,3),lh=fs*1.22;
  const ch=lines.length*lh+fs*1.9;
  const g=ctx.createLinearGradient(0,y+h-ch,0,y+h);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.55,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,.92)');
  ctx.fillStyle=g;ctx.fillRect(x,y+h-ch,w,ch);
  ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=3;
  lines.forEach((ln,i)=>ctx.fillText(ln,x+w/2,y+h-4-(lines.length-1-i)*lh-fs*.28));
  ctx.restore();
}

      const id=arr[i];
      if(id){
        const mv=byId.get(id);const img=await loadImg(mv.img);
        drawCard(ctx,img,cx,cy,cw,1.5*cw,mv.title);
        if(i<cap){
          roundRect(ctx,cx,cy,cw,1.5*cw,Math.max(4,cw*.06));
          ctx.lineWidth=2;ctx.strokeStyle='rgba(246,227,166,.55)';ctx.setLineDash([]);ctx.stroke();
        }
      }else{
        roundRect(ctx,cx,cy,cw,1.5*cw,6);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fill();
        ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.setLineDash([7,6]);ctx.stroke();ctx.setLineDash([]);
      }
    }
    y+=rowH+.12*u;
  }
  return cv;
}
$('btnSave').addEventListener('click',async()=>{
  const btn=$('btnSave');btn.disabled=true;
  try{
    const cv=await renderPng();
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    if(!blob)throw new Error('empty');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='movie_tierlist.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast('티어 표를 이미지로 저장했어요');
  }catch(err){toast('이미지를 저장하지 못했어요')}
  btn.disabled=false;
});

/* ---------- 시작 ---------- */
renderAll();
layout();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(tick)});
})();
</script>
