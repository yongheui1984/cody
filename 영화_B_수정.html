    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 8px 12px 4px; flex-shrink: 0; }
  header .kicker {
    display: inline-block; font-size: 11px; letter-spacing: 5px; color: #ffd98a;
    border-top: 1px solid #c9a24b; border-bottom: 1px solid #c9a24b;
    padding: 4px 10px; margin-bottom: 6px;
  }
  header h1 {
    font-size: clamp(22px, 3.2vw, 34px); font-weight: 800; color: #ffe9b0;
    text-shadow: 0 2px 18px rgba(255, 190, 80, .35); letter-spacing: 2px;
  }
  header p { margin-top: 4px; font-size: 12px; color: #e6cf9a; text-shadow: 0 1px 4px #000; }
  main {
    width: min(1100px, 96vw); flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  #board {
    width: 100%; flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px 10px; border: 1px solid rgba(201,162,75,.6);
    border-radius: 12px; background: rgba(0,0,0,.55);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .tier { display: flex; justify-content: center; margin: 4px 0; }
  .tier-inner {
    display: flex; align-items: center; gap: 8px;
    border-radius: 10px; padding: 4px 8px;
    border: 2px solid #888; background: rgba(128,128,128,.15);
    transition: background .2s, border-color .2s;
    max-width: 100%; flex-wrap: wrap; justify-content: center;
  }
  .tier-inner[data-state="empty"] { border-color: #8a8a8a; background: rgba(130,130,130,.16); }
  .tier-inner[data-state="lack"]  { border-color: #d8b400; background: rgba(216,180,0,.14); }
  .tier-inner[data-state="full"]  { border-color: #2ecc71; background: rgba(46,204,113,.14); }
  .tier-inner[data-state="over"]  { border-color: #e74c3c; background: rgba(231,76,60,.16); }
  .badge {
    min-width: 44px; display: flex; align-items: center; justify-content: center;
    align-self: stretch; font-size: 22px; font-weight: 900; border-radius: 8px; padding: 2px 6px; color: #111;
  }
  .badge.s { background: linear-gradient(180deg, #ffe27a, #d4a017); }
  .badge.a { background: linear-gradient(180deg, #ffc46b, #e08a00); }
  .badge.b { background: linear-gradient(180deg, #e8e8e8, #9a9a9a); }
  .badge.c { background: linear-gradient(180deg, #d9a05f, #8a5a1e); }
  .badge.d { background: linear-gradient(180deg, #9db3c8, #4a6076); color: #fff; }
  .slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .slot {
    width: var(--cw); height: var(--ch); border: 2px dashed rgba(255,255,255,.55);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: rgba(255,255,255,.6);
  }
  .card {
    width: var(--cw); height: var(--ch); border-radius: 6px; overflow: hidden; cursor: grab;
    border: 2px solid rgba(255,255,255,.25); background: #222; user-select: none; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .card:active { cursor: grabbing; }

function makeCard(m) {
  var el = document.createElement("div");
  el.className = "card";
  el.draggable = true;
  el.dataset.id = m.id;
  var p = document.createElement("div");
  p.className = "poster";
  var im = document.createElement("img");
  im.src = m.img;
  im.alt = m.title;
  im.draggable = false;
  p.appendChild(im);
  var c = document.createElement("div");
  c.className = "cap";
  c.textContent = m.title;
  el.appendChild(p);
  el.appendChild(c);
  el.addEventListener("dragstart", function (e) {
    try { e.dataTransfer.setData("text/plain", m.id); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
    paused = true;
    el.classList.add("dragging");
    showGhost(el, e.clientX, e.clientY);
  });
  el.addEventListener("drag", function (e) { moveGhost(e.clientX, e.clientY); });
  el.addEventListener("dragend", function () {
    paused = false;
    el.classList.remove("dragging");
    hideGhost();
    clearHi();
  });
  el.addEventListener("pointerdown", function () { paused = true; });
  el.addEventListener("pointerup", function () { paused = false; });
  return el;
}
function showGhost(card, x, y) {
  hideGhost();
  if (!document.body) return;
  ghost = card.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = card.offsetWidth + "px";
  ghost.style.height = card.offsetHeight + "px";
  document.body.appendChild(ghost);
  moveGhost(x, y);
}
function moveGhost(x, y) {
  if (!ghost || !x || !y) return;
  ghost.style.left = (x - 40) + "px";
  ghost.style.top = (y - 60) + "px";
}
function hideGhost() {
  if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
  ghost = null;
}
function clearHi() {
  var hs = document.querySelectorAll(".drop-hi");
  for (var i = 0; i < hs.length; i++) hs[i].classList.remove("drop-hi");
}
function watchHi(el) {
  var n = 0;
  el.addEventListener("dragenter", function (e) { e.preventDefault(); n++; el.classList.add("drop-hi"); });
  el.addEventListener("dragleave", function () { n--; if (n <= 0) { n = 0; el.classList.remove("drop-hi"); } });
  el.addEventListener("drop", function () { n = 0; el.classList.remove("drop-hi"); });
}
function makeSlot() {
  var el = document.createElement("div");
  el.className = "slot";
  el.textContent = "빈 칸";
  return el;
}
function render() {
  var track = document.getElementById("track");
  track.innerHTML = "";
  var trayCards = loc.tray.map(function (id) { return makeCard(movieById(id)); });
  trayCards.concat(trayCards.map(function (card) {
    var m = movieById(card.dataset.id);
    var dup = makeCard(m);
    dup.setAttribute("aria-hidden", "true");
    return dup;
  })).forEach(function (card) { track.appendChild(card); });
  var tiers = document.querySelectorAll(".tier-inner");
  for (var i = 0; i < tiers.length; i++) {
    (function (tierEl) {
      var t = tierEl.dataset.tier;
      var slots = tierEl.querySelector(".slots");
      slots.innerHTML = "";
      var placed = loc[t];
      for (var k = 0; k < CAP[t]; k++) {
        if (placed[k]) slots.appendChild(makeCard(movieById(placed[k])));
        else slots.appendChild(makeSlot());
      }
      placed.slice(CAP[t]).forEach(function (id) { slots.appendChild(makeCard(movieById(id))); });
      tierEl.dataset.state = tierState(t);
    })(tiers[i]);
  }
}
function say(text) { var msg = document.getElementById("msg"); if (msg) msg.textContent = text; }
function tick() {
  var tray = document.getElementById("tray");
  var track = document.getElementById("track");
  if (!paused && track.children.length > 0 && track.scrollWidth > 0) {
    tray.scrollLeft += SPEED;
    if (tray.scrollLeft >= track.scrollWidth / 2) tray.scrollLeft -= track.scrollWidth / 2;
  }
  requestAnimationFrame(tick);
}
function drawCover(g, img, x, y, w, h) {
  var sc = Math.max(w / img.width, h / img.height);
  var dw = img.width * sc, dh = img.height * sc;
  g.drawImage(img, x - (dw - w) / 2, y - (dh - h) / 2, dw, dh);
}
function posterFallback(g, m, x, y, w, h) {
  g.fillStyle = "#3a1522";
  g.fillRect(x, y, w, h);
  g.fillStyle = "#fff";
  g.font = "700 20px sans-serif";
  g.textAlign = "center";
  g.fillText(m.title.slice(0, 6), x + w / 2, y + h / 2);
}
function exportPNG() {
  var W = 1920, H = 1080;
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var g = cv.getContext("2d");
  if (bgImg && bgImg.width) {
    drawCover(g, bgImg, 0, 0, W, H);
    g.fillStyle = "rgba(8,4,7,0.72)";
    g.fillRect(0, 0, W, H);
  } else {
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#3a1522"); bg.addColorStop(1, "#070405");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
  }
  g.textAlign = "center";
  g.fillStyle = "#ffe9b0";
  g.font = "800 88px sans-serif";
  g.fillText("2026 무비 어워즈", W / 2, 140);
  g.fillStyle = "#e6cf9a";
  g.font = "400 30px sans-serif";
  g.fillText("2026년 개봉 · 관객 100만 이상 15편 티어리스트", W / 2, 190);
  var labelColors = { S: "#ffd94d", A: "#ffab4d", B: "#cfcfcf", C: "#d9a05f", D: "#9db3c8" };
  var cardW = 150, cardH = 118, gap = 14, labelW = 110, rowH = 148;
  var y = 235;
  ORDER.forEach(function (t) {
    var placed = loc[t];
    var n = Math.max(placed.length, CAP[t]);
    var groupW = labelW + gap + n * (cardW + gap);
    var x = (W - groupW) / 2;
    g.fillStyle = labelColors[t];
    g.fillRect(x, y, labelW, cardH);
    g.fillStyle = "#111";
    g.font = "900 64px sans-serif";
    g.fillText(t, x + labelW / 2, y + 84);
    var cx = x + labelW + gap;
    for (var k = 0; k < n; k++) {
      if (placed[k]) {
        var m = movieById(placed[k]);
        var im = posterImgs[m.id];
        if (im && im.width) drawCover(g, im, cx, y, cardW, cardH);
        else posterFallback(g, m, cx, y, cardW, cardH);
        g.fillStyle = "rgba(0,0,0,0.55)";
        g.fillRect(cx, y + cardH - 30, cardW, 30);
        g.fillStyle = "#fff";
        g.font = "700 19px sans-serif";
        var title = m.title.length > 8 ? m.title.slice(0, 8) + "…" : m.title;
        g.fillText(title, cx + cardW / 2, y + cardH - 8);
      } else {
        g.strokeStyle = "rgba(255,255,255,0.6)";
        g.lineWidth = 2;
        if (g.setLineDash) g.setLineDash([8, 6]);
        g.strokeRect(cx, y, cardW, cardH);
        if (g.setLineDash) g.setLineDash([]);
      }
      cx += cardW + gap;
    }
    y += rowH;
  });
  var a = document.createElement("a");
  a.download = "2026-무비-어워즈-티어리스트.png";
  a.href = cv.toDataURL("image/png");
  a.click();
  say("티어 표 이미지를 저장했습니다.");
}
function init() {
  load();
  preload();
  render();
  var tiers = document.querySelectorAll(".tier-inner");
  for (var i = 0; i < tiers.length; i++) {
    (function (tierEl) {
      var t = tierEl.dataset.tier;
      var slots = tierEl.querySelector(".slots");
      watchHi(slots);
      slots.addEventListener("dragover", function (e) { e.preventDefault(); });
      slots.addEventListener("drop", function (e) {
        e.preventDefault();
        paused = false;
        hideGhost();
        var id = e.dataTransfer.getData("text/plain");
        moveMovie(id, t);
        say("“" + (movieById(id) ? movieById(id).title : "") + "”을(를) " + t + "티어에 배치했습니다.");
      });
    })(tiers[i]);
  }
  var tray = document.getElementById("tray");
  watchHi(tray);
  tray.addEventListener("dragover", function (e) { e.preventDefault(); });
  tray.addEventListener("drop", function (e) {
    e.preventDefault();
    paused = false;
    hideGhost();
    var id = e.dataTransfer.getData("text/plain");
    moveMovie(id, "tray");
    say("슬라이드로 되돌렸습니다.");
  });
  document.getElementById("btnSave").addEventListener("click", exportPNG);
  document.getElementById("btnReset").addEventListener("click", function () {
    if (typeof confirm === "function" && !confirm("맨 처음 상태로 되돌릴까요?")) return;
    loc = freshLoc();
    save();
    render();
    say("처음 상태로 되돌렸습니다.");
  });
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
